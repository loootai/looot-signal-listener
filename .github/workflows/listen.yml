name: listen

# Runs the listener every weekday at 07:00 UTC and on demand.
# Needs repo secrets: LOOOT_TOKEN, and optionally SLACK_WEBHOOK_URL and SIGNAL_WEBHOOK_URL.
# The dedupe state lives in the Actions cache, so a signal is reported once.
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listen
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Restore state
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .signals
          key: signals-state-${{ github.run_id }}
          restore-keys: signals-state-
      - name: Quote
        run: node src/cli.ts quote --config icp.json
      - name: Run
        env:
          LOOOT_TOKEN: ${{ secrets.LOOOT_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SIGNAL_WEBHOOK_URL: ${{ secrets.SIGNAL_WEBHOOK_URL }}
        run: node src/cli.ts run --config icp.json --out out --new-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signals-${{ github.run_id }}
          path: out/
          retention-days: 30
