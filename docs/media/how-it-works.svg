<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(0,147,98)"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="16" fill="#0b0f0d"/>

  <text x="40" y="52" fill="#e8efe9" font-size="26" font-weight="700">How looot-signal-listener works</text>
  <text x="40" y="82" fill="#8a9a92" font-size="16">One config file in, scored signals out. Paid sources run through one looot key, inside a budget you set.</text>

  <!-- 1. config -->
  <rect x="40" y="120" width="250" height="300" rx="12" fill="#111816" stroke="#24342d"/>
  <text x="60" y="152" fill="rgb(0,147,98)" font-size="14" font-weight="700">1. YOUR ICP</text>
  <text x="60" y="182" fill="#e8efe9" font-size="20" font-weight="700" font-family="Menlo, 'SF Mono', monospace">icp.json</text>
  <g fill="#b9c6bf" font-size="15">
    <text x="60" y="218">product and buyer words</text>
    <text x="60" y="244">pain and intent phrases</text>
    <text x="60" y="270">job titles to watch</text>
    <text x="60" y="296">accounts and their pages</text>
    <text x="60" y="322">competitor tools</text>
    <text x="60" y="348">budgetUsd, minScore</text>
  </g>
  <text x="60" y="396" fill="#8a9a92" font-size="13">quote shows the max cost first, free</text>

  <!-- 2. sources -->
  <rect x="340" y="120" width="270" height="300" rx="12" fill="#111816" stroke="#24342d"/>
  <text x="360" y="152" fill="rgb(0,147,98)" font-size="14" font-weight="700">2. SOURCES, ONE LOOOT KEY</text>
  <g fill="#b9c6bf" font-size="15">
    <text x="360" y="186">Reddit, X posts</text>
    <text x="360" y="212">Hacker News <tspan fill="rgb(0,147,98)">(free, no key)</tspan></text>
    <text x="360" y="238">LinkedIn jobs</text>
    <text x="360" y="264">Google News: funding,</text>
    <text x="360" y="288">leadership, account news</text>
    <text x="360" y="314">PredictLeads funding</text>
    <text x="360" y="340">Tomba tech stack</text>
    <text x="360" y="366">Jina reader web pages</text>
  </g>
  <text x="360" y="400" fill="#8a9a92" font-size="13">pinned endpoints, idempotent reruns</text>

  <!-- 3. dedupe + score -->
  <rect x="660" y="120" width="270" height="300" rx="12" fill="#111816" stroke="#24342d"/>
  <text x="680" y="152" fill="rgb(0,147,98)" font-size="14" font-weight="700">3. DEDUPE AND SCORE</text>
  <g fill="#b9c6bf" font-size="15">
    <text x="680" y="186">one signal per URL,</text>
    <text x="680" y="210">across sources and runs</text>
    <text x="680" y="242">diff tech stacks and pages</text>
    <text x="680" y="266">against the last snapshot</text>
    <text x="680" y="298">score 0 to 100,</text>
    <text x="680" y="322">every point has a reason:</text>
  </g>
  <rect x="680" y="336" width="232" height="56" rx="8" fill="#0b0f0d" stroke="#24342d"/>
  <g font-family="Menlo, 'SF Mono', monospace" font-size="12.5">
    <text x="692" y="358" fill="rgb(0,147,98)">+25 dropped competitor</text>
    <text x="692" y="378" fill="rgb(0,147,98)">+15 pain: "landing in spam"</text>
  </g>

  <!-- 4. outputs -->
  <rect x="980" y="120" width="260" height="300" rx="12" fill="#111816" stroke="#24342d"/>
  <text x="1000" y="152" fill="rgb(0,147,98)" font-size="14" font-weight="700">4. OUTPUTS</text>
  <g fill="#b9c6bf" font-size="15">
    <text x="1000" y="186">terminal table</text>
    <text x="1000" y="212">run.json, signals.csv</text>
    <text x="1000" y="238">Slack message</text>
    <text x="1000" y="264">webhook: n8n, Zapier,</text>
    <text x="1000" y="288">Make, your CRM</text>
    <text x="1000" y="314">email drafts (never sent)</text>
    <text x="1000" y="340">accounts grouped:</text>
    <text x="1000" y="364">two signal kinds rank higher</text>
  </g>

  <!-- arrows between columns -->
  <line x1="292" y1="270" x2="336" y2="270" stroke="rgb(0,147,98)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="612" y1="270" x2="656" y2="270" stroke="rgb(0,147,98)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="932" y1="270" x2="976" y2="270" stroke="rgb(0,147,98)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 5. schedule loop -->
  <path d="M1110,422 L1110,486 L165,486 L165,424" fill="none" stroke="rgb(0,147,98)" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="440" y="466" width="400" height="40" rx="20" fill="#0b0f0d" stroke="rgb(0,147,98)"/>
  <text x="640" y="492" fill="#e8efe9" font-size="15" text-anchor="middle">5. GitHub Action, weekdays 07:00 UTC</text>
  <text x="640" y="536" fill="#8a9a92" font-size="13" text-anchor="middle">Dedupe state lives in the Actions cache, so each signal is reported once.</text>
</svg>
